# Launch/splash screen for NūriTalk AAC.
#
# NūriTalk official emblem centered on background with light/dark support.
flutter_native_splash:
  color: "#ffffff"
  color_dark: "#0A2540"
  image: assets/brand/nuritalk_emblem.png

  # Android 12+ uses a separate splash API (icon on a solid window
  # background).
  android_12:
    image: assets/brand/nuritalk_emblem.png
    color: "#ffffff"
    color_dark: "#0A2540"
